  <title>Анти Котопарк</title>
  <script>
    // Устанавливаем тему ДО отрисовки, чтобы не было вспышки не той темы.
    // Первый запуск (localStorage пуст) → светлая тема «Королевский Котопарк».
    (function () {
      try {
        var t = localStorage.getItem('ak_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
